apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patchesStrategicMerge:
  - deployment.yaml
  - service.yaml
namespace: instavote
images:
  - name: schoolofdevops/vote
    newName: amlynqtech/vote
    newTag: main-43c9490c-1759769576 # {"$imagepolicy": "flux-system:vote:tag"}
replicas:
  - name: vote
    count: 4
commonLabels:
  project: instavote
  env: staging
commonAnnotations:
  supported-by: "sre@example.com"
configMapGenerator:
  - name: vote
    literals:
      - OPTION_A=FluxCD
      - OPTION_B=ArgoCD
